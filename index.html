<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0a08" />

    <!-- Primary meta -->
    <title>Muhammad Romeo Raffael — Fullstack Developer</title>
    <meta
      name="description"
      content="Muhammad Romeo Raffael — Fullstack Developer (Web & Mobile) building modern, scalable apps with React, Node.js, Flutter, and Supabase."
    />
    <!-- TODO: set the canonical/live URL once deployed -->
    <link rel="canonical" href="https://example.com/" />

    <!-- Favicon (SVG, orange accent) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Muhammad Romeo Raffael — Fullstack Developer" />
    <meta
      property="og:description"
      content="Fullstack Developer (Web & Mobile) building modern, scalable apps with React, Node.js, Flutter, and Supabase."
    />
    <!-- TODO: set the live URL once deployed -->
    <meta property="og:url" content="https://example.com/" />
    <!-- TODO: drop a real 1200×630 image at public/og.png -->
    <meta property="og:image" content="/og.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Muhammad Romeo Raffael — Fullstack Developer" />
    <meta
      name="twitter:description"
      content="Fullstack Developer (Web & Mobile) building modern, scalable apps with React, Node.js, Flutter, and Supabase."
    />
    <!-- TODO: drop a real 1200×630 image at public/og.png -->
    <meta name="twitter:image" content="/og.png" />

    <!-- Fonts: Syne (display), JetBrains Mono (mono), Hanken Grotesk (body).
         Loaded non-blocking via preload + media=print swap; display=swap
         avoids invisible-text flashes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Hanken+Grotesk:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Hanken+Grotesk:wght@400;500;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Hanken+Grotesk:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
